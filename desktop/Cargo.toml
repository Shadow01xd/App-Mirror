[package]
name = "tyu-desktop"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
slint = "=1.17.1"
image = { version = "0.25", default-features = false, features = ["png"] }
tiny_http = "0.12"
qrcode = "0.14"
uuid = { version = "1", features = ["v4"] }
serde_json = "1"
url = "2"
tyu-core.workspace = true
tokio.workspace = true
tokio-util.workspace = true
bytes.workspace = true
directories.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
if-addrs = "0.15"
openh264 = "0.9.8"
windows = { version = "0.61", features = [
    "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_Foundation",
    "Win32_Devices_DeviceAndDriverInstallation", "Win32_System_IO", "Win32_Storage_FileSystem",
    "Win32_System_Threading", "Win32_Security",
    "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common",
    "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant",
] }

[build-dependencies]
slint-build = "=1.17.1"

[dev-dependencies]
tempfile.workspace = true
